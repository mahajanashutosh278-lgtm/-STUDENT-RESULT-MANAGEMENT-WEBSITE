2. INTERMEDIATE — STUDENT RESULT MANAGEMENT WEBSITE
<!DOCTYPE html>
<html>

<head>

    <title>Student Result Management</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #eef2f7;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 600px;
            margin: 40px auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h1 {
            text-align: center;
            color: #1f2937;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
            border: 1px solid #aaa;
            border-radius: 5px;
        }

        button {
            width: 48%;
            padding: 12px;
            margin-top: 20px;
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }

        #calculateBtn {
            background-color: #2563eb;
        }

        #resetBtn {
            background-color: #555;
        }

        #result {
            margin-top: 25px;
            padding: 20px;
            background-color: #f3f4f6;
            border-radius: 8px;
            display: none;
        }

        .error {
            color: red;
            text-align: center;
        }

    </style>

</head>


<body>

<div class="container">

    <h1>Student Result Management</h1>

    <label>Student Name</label>
    <input type="text" id="studentName" placeholder="Enter student name">


    <label>Roll Number</label>
    <input type="text" id="rollNumber" placeholder="Enter roll number">


    <label>Mathematics</label>
    <input type="number" id="maths" min="0" max="100">


    <label>Computer Science</label>
    <input type="number" id="computer" min="0" max="100">


    <label>English</label>
    <input type="number" id="english" min="0" max="100">


    <label>Physics</label>
    <input type="number" id="physics" min="0" max="100">


    <label>C Programming</label>
    <input type="number" id="cprogramming" min="0" max="100">


    <button id="calculateBtn" onclick="calculateResult()">
        Calculate Result
    </button>

    <button id="resetBtn" onclick="resetForm()">
        Reset
    </button>


    <div id="result"></div>

</div>


<script>

function calculateResult()
{

    let name = document.getElementById("studentName").value;
    let roll = document.getElementById("rollNumber").value;

    let maths = Number(document.getElementById("maths").value);
    let computer = Number(document.getElementById("computer").value);
    let english = Number(document.getElementById("english").value);
    let physics = Number(document.getElementById("physics").value);
    let cprogramming = Number(document.getElementById("cprogramming").value);


    if (name === "" || roll === "")
    {
        alert("Please enter student name and roll number.");
        return;
    }


    if (
        maths < 0 || maths > 100 ||
        computer < 0 || computer > 100 ||
        english < 0 || english > 100 ||
        physics < 0 || physics > 100 ||
        cprogramming < 0 || cprogramming > 100
    )
    {
        alert("Marks must be between 0 and 100.");
        return;
    }


    let total =
        maths +
        computer +
        english +
        physics +
        cprogramming;


    let percentage = total / 5;

    let grade;


    if (percentage >= 90)
        grade = "A+";

    else if (percentage >= 80)
        grade = "A";

    else if (percentage >= 70)
        grade = "B";

    else if (percentage >= 60)
        grade = "C";

    else if (percentage >= 50)
        grade = "D";

    else
        grade = "F";


    let result;


    if (
        maths >= 40 &&
        computer >= 40 &&
        english >= 40 &&
        physics >= 40 &&
        cprogramming >= 40
    )
    {
        result = "PASS";
    }
    else
    {
        result = "FAIL";
    }


    let resultBox = document.getElementById("result");

    resultBox.style.display = "block";


    resultBox.innerHTML =

        "<h2>Student Result</h2>" +

        "<p><b>Name:</b> " + name + "</p>" +

        "<p><b>Roll Number:</b> " + roll + "</p>" +

        "<hr>" +

        "<p><b>Total Marks:</b> " +
        total + " / 500</p>" +

        "<p><b>Percentage:</b> " +
        percentage.toFixed(2) + "%</p>" +

        "<p><b>Grade:</b> " +
        grade + "</p>" +

        "<p><b>Result:</b> " +
        result + "</p>";
}


function resetForm()
{
    document.getElementById("studentName").value = "";
    document.getElementById("rollNumber").value = "";

    document.getElementById("maths").value = "";
    document.getElementById("computer").value = "";
    document.getElementById("english").value = "";
    document.getElementById("physics").value = "";
    document.getElementById("cprogramming").value = "";

    document.getElementById("result").style.display = "none";
}

</script>

</body>

</html>
